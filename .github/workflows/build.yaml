name: Docker build
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v1
      - name: Build Comby Docker image
        run: docker build . --file Dockerfile --tag test-build:latest
      - name: Run Comby tests
        run: |
          container=$(docker create \
            -e CI -e GITHUB_ACTIONS -e GITHUB_WORKFLOW -e GITHUB_RUN_ID \
            -e GITHUB_RUN_NUMBER -e GITHUB_JOB -e GITHUB_ACTION -e GITHUB_HEAD_REF \
            -e GITHUB_REF -e GITHUB_REPOSITORY -e GITHUB_SHA \
            test-build:latest /bin/bash -c \
            'opam exec -- make build-with-coverage && opam exec -- dune runtest --instrument-with bisect_ppx --force && opam exec -- bisect-ppx-report summary && opam exec -- bisect-ppx-report cobertura coverage.xml')
          trap 'docker rm "$container" >/dev/null' EXIT
          docker start -a "$container"
          docker cp "$container:/home/comby/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
  release-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - dockerfiles/alpine/binary-release/Dockerfile
          - dockerfiles/ubuntu/binary-release/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build release image, which also runs the tests
        run: docker build . --file ${{ matrix.dockerfile }} --tag release-image:latest
